<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свидание</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <!-- Экран 1: приглашение -->
  <div id="screen1" class="screen active">
    <div class="hearts">❤️❤️</div>
    <h1>Моя любимая,</h1>
    <img src="cat.jpg" alt="фото" class="photo">
   <p>🌹🌹 Пойдёшь ли ты со мной на свидание? 🌹🌹</p>
    <p class="subtitle">Я обещаю, что это будет незабываемо 💐</p>
    <button class="btn-yes" onclick="showScreen('screen2')">Да, конечно!</button>
    <button id="btn-no" class="btn-no">Да 💕</button>
  </div>

  <!-- Экран 2 появится позже -->
<div id="screen2" class="screen">
  <h2>Что бы ты хотела на нашем свидании? 😊</h2>
  <div class="food-grid">
    <button class="food-card" onclick="selectPlan('Пицца 🍕')">🍕<br>Пицца</button>
    <button class="food-card" onclick="selectPlan('Паста 🍝')">🍝<br>Паста</button>
    <button class="food-card" onclick="selectPlan('Cinema 🎬')">🎬<br>Cinema</button>
    <button class="food-card" onclick="selectPlan('PUB English 🍺')">🍺<br>PUB English</button>
  </div>
</div>
<div id="screen3" class="screen">
  <h2>Когда ты свободна? 📅</h2>
  <label>Выбери дату:</label>
  <input type="date" id="dateInput">

  <label>Выбери время:</label>
  <div class="time-options">
    <button class="time-card" onclick="selectTime(this, '17:00')">🌇 17:00</button>
    <button class="time-card" onclick="selectTime(this, '18:00')">🌆 18:00</button>
    <button class="time-card" onclick="selectTime(this, '19:00')">🌙 19:00</button>
  </div>

  <button class="btn-yes" onclick="goNext()">Готово! →</button>
</div>
<div id="screen4" class="screen">
  <div class="hearts">❤️💕💖💕❤️</div>
  <h2>Ура! 🎉</h2>
  <p>Спасибо, что согласилась! Жди подтверждения от меня 💌</p>
  <div class="hearts">❤️💕💖💕❤️</div>
</div>
  <script src="script.js"></script>
</body>
</html>
